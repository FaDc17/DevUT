<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevUT · Eventos</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments :: navbar('events')}"></header><main class="section-shell page-main"><div class="page-intro"><span class="section-kicker">AGENDA DEVUT</span><h1>Encuentra tu <span>próximo evento</span></h1><p>Explora encuentros para aprender, inspirarte y conocer a tu próxima gran conexión en Lima.</p></div><div class="filters"><label class="search-box"><input id="eventSearch" placeholder="Buscar por nombre..."></label><label class="select-box"><select id="categoryFilter"><option>Todas las categorías</option><option>Ingeniería de software</option><option>Datos e IA</option><option>Nube y DevOps</option><option>Ciberseguridad</option><option>Desarrollo web y móvil</option><option>Emprendimiento y startups</option><option>Medicina y salud</option><option>Arquitectura y diseño</option><option>Negocios y finanzas</option><option>Networking y comunidad</option></select></label></div><div class="result-count"><strong id="resultCount"><span th:text="${#lists.size(events)}"></span> eventos</strong><span>en Lima, Perú</span></div><div class="event-list" id="eventList"><article class="event-card event-horizontal" th:each="event : ${events}" th:data-category="${event.category}" th:data-title="${event.title}"><div class="image-placeholder" th:style="'--placeholder-accent:'+${event.accent}"><span class="placeholder-glow"></span></div><div class="event-card-body"><span class="tag" th:text="${event.category}"></span><h3 th:text="${event.title}"></h3><div class="event-meta" th:text="${event.date + ' · ' + event.time}"></div><div class="event-meta" th:text="${event.place}"></div><p th:text="${event.description}"></p><div class="card-actions"><a class="btn btn-primary" th:href="@{/event/{id}(id=${event.id})}">Ver info →</a><button class="btn btn-whatsapp">◉ WhatsApp</button></div></div></article></div></main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
