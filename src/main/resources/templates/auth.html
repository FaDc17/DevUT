<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevUT · Iniciar sesión</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-page">
  <div class="auth-decoration auth-decoration-one"></div>
  <div class="auth-decoration auth-decoration-two"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-shell"><img th:src="@{/images/devut-wordmark.png}" alt="DevUT" class="logo"></span>
    </div>
    <div class="auth-heading">
      <span id="authKicker">BIENVENIDO DE VUELTA</span>
      <h1 id="authTitle">Inicia sesión</h1>
      <p id="authSubtitle">Tu próxima conexión está a un paso.</p>
    </div>

    <form th:action="@{/login}" method="post" class="auth-form">
      <div th:if="${error}" class="form-error" role="alert" th:text="${error}"></div>
      <label><span>Correo electrónico</span>
        <input required type="email" name="username" id="username" placeholder="Correo electrónico">
      </label>
      <label>Contraseña
        <div class="password-input">
          <input required name="password" id="password" type="password" placeholder="••••••••">
          <button type="button" id="togglePassword" aria-label="Mostrar contraseña">◉</button>
        </div>
      </label>

      <button type="button" class="forgot" id="forgotButton">¿Olvidaste tu contraseña?</button>
      <button class="btn btn-primary btn-wide" type="submit">Iniciar sesión <span>→</span></button>
    </form>

    <div id="socialLogin">
      <div class="or"><span></span>o continúa con<span></span></div>
      <div class="social-login">
        <button type="button">
          <span class="social-google" aria-hidden="true">G</span>
          Continuar con Google
        </button>
        <button type="button">
          <span class="social-linkedin" aria-hidden="true">in</span>
          Continuar con LinkedIn
        </button>
      </div>
    </div>

    <p class="auth-switch"><span>¿No estás registrado?</span>
      <a th:href="@{/register}" id="authSwitch" class="auth-switch-link">Regístrate ahora</a>
    </p>
  </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
